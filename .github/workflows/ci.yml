name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/pharm_lms_ci?schema=public
      AUTH_SECRET: ci-test-auth-secret-minimum-32-characters
      PAYSTACK_SECRET_KEY: sk_test_ci_placeholder
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: pk_test_ci_placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (changed infrastructure)
        run: pnpm exec biome check lib/env.ts instrumentation.ts lib/auth/require-api-session.ts lib/rate-limit.ts lib/payments/fee-split.ts tests

      - name: Prisma validate
        run: pnpm exec prisma validate

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
