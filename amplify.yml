version: 1
settings:
  nodeVersion: "22"
frontend:
  phases:
    preBuild:
      commands:
        - node -v
        - corepack enable
        - corepack prepare pnpm@9.15.9 --activate
        - pnpm -v
        # Drop any npm install Amplify may run before this file; we use pnpm-lock.yaml only.
        - rm -rf node_modules
        - rm -f package-lock.json
        - pnpm install --frozen-lockfile
        - pnpm exec prisma generate
    build:
      commands:
        - pnpm run build
        - node scripts/resolve-next-symlinks.js
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
